[project]
name = "uc-intg-moonraker"
version = "0.1.0"
description = "Unfolded Circle Remote Two/3 integration for Klipper printers via Moonraker"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"

dependencies = [
    "ucapi==0.7.0",
    "ucapi-framework==1.9.8",
    "pyee>=9.0",
    "aiohttp>=3.9",
    "pillow>=10.0",
    "zeroconf>=0.132",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
