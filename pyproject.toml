[project]
name = "uc-intg-moonraker"
version = "0.0.0"  # releases are versioned by git tags, see README
description = "Unfolded Circle Remote Two/3 integration for Klipper printers via Moonraker"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"

dependencies = [
    "ucapi==0.7.0",
    "ucapi-framework==1.9.8",
    "aiohttp>=3.10.11",
    "pillow>=10.3",
    "zeroconf>=0.132",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["intg-moonraker"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.black]
line-length = 120
