# Docker Compose for development with the UC Core Simulator
name: integration-moonraker

services:
  # Unfolded Circle Core Simulator for testing
  core-simulator:
    image: unfoldedcircle/core-simulator
    restart: "unless-stopped"
    hostname: core-simulator
    environment:
      - UC_INTEGRATION_DISABLE_CERT_VERIFICATION=true
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - simulator-data:/data

  # The integration, restarted on code changes
  intg-moonraker:
     build:
       context: ../
       dockerfile: ./dev/Dockerfile
     hostname: moonraker
     # nodemon watches for file changes and auto-restarts
     command: bash -c "UC_INTEGRATION_INTERFACE=$(hostname -i) nodemon -e py,json --exec 'python3 -u' intg-moonraker/driver.py"
     volumes:
       - ../:/app

volumes:
  simulator-data:
