# Lint and test suite. Required status check for pull requests to main,
# also called by the release workflow before building.
name: CI

"on":
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test-requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r test-requirements.txt

      - name: Lint
        run: |
          flake8 intg-moonraker tests
          pylint intg-moonraker
          black --check intg-moonraker tests
          isort --check-only intg-moonraker tests

      - name: Test with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
