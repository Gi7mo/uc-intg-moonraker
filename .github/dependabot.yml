version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Python version of the remote's runtime (r2-pyinstaller 3.11)
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
